<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TikTok Games - Jogos Interativos</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <!-- Menu Principal -->
        <div id="mainMenu" class="menu">
            <h1>🎮 TikTok Games</h1>
            <p>Escolha um jogo para começar!</p>
            <div class="games-grid">
                <button class="game-btn" onclick="selectGame('tapSpeed')">
                    <span class="emoji">🎯</span>
                    <span>Tap Speed</span>
                </button>
                <button class="game-btn" onclick="selectGame('memory')">
                    <span class="emoji">🧠</span>
                    <span>Memory Game</span>
                </button>
                <button class="game-btn" onclick="selectGame('reaction')">
                    <span class="emoji">⚡</span>
                    <span>Reaction Time</span>
                </button>
                <button class="game-btn" onclick="selectGame('colorMatch')">
                    <span class="emoji">🎨</span>
                    <span>Color Match</span>
                </button>
                <button class="game-btn" onclick="selectGame('flappyBird')">
                    <span class="emoji">🐦</span>
                    <span>Flappy Bird</span>
                </button>
            </div>
        </div>

        <!-- Tap Speed Game -->
        <div id="tapSpeedGame" class="game-container hidden">
            <div class="game-header">
                <h2>🎯 Tap Speed</h2>
                <button class="back-btn" onclick="backToMenu()">← Voltar</button>
            </div>
            <div class="game-content">
                <div class="stats">
                    <div class="stat">
                        <span class="label">Tempo:</span>
                        <span class="value" id="tapTime">10</span>s
                    </div>
                    <div class="stat">
                        <span class="label">Cliques:</span>
                        <span class="value" id="tapClicks">0</span>
                    </div>
                </div>
                <button id="tapButton" class="tap-button" onclick="tapClick()">TAP!</button>
                <button id="tapStartBtn" class="start-btn" onclick="startTapSpeed()">COMEÇAR</button>
                <div id="tapResult" class="result hidden"></div>
            </div>
        </div>

        <!-- Memory Game -->
        <div id="memoryGame" class="game-container hidden">
            <div class="game-header">
                <h2>🧠 Memory Game</h2>
                <button class="back-btn" onclick="backToMenu()">← Voltar</button>
            </div>
            <div class="game-content">
                <div class="stats">
                    <div class="stat">
                        <span class="label">Pares:</span>
                        <span class="value" id="memoryPairs">0/8</span>
                    </div>
                    <div class="stat">
                        <span class="label">Movimentos:</span>
                        <span class="value" id="memoryMoves">0</span>
                    </div>
                </div>
                <div id="memoryGrid" class="memory-grid"></div>
                <button id="memoryStartBtn" class="start-btn" onclick="startMemory()">COMEÇAR</button>
                <div id="memoryResult" class="result hidden"></div>
            </div>
        </div>

        <!-- Reaction Time Game -->
        <div id="reactionGame" class="game-container hidden">
            <div class="game-header">
                <h2>⚡ Reaction Time</h2>
                <button class="back-btn" onclick="backToMenu()">← Voltar</button>
            </div>
            <div class="game-content">
                <div class="stats">
                    <div class="stat">
                        <span class="label">Rodada:</span>
                        <span class="value" id="reactionRound">0/5</span>
                    </div>
                    <div class="stat">
                        <span class="label">Tempo Médio:</span>
                        <span class="value" id="reactionAvg">-</span>ms
                    </div>
                </div>
                <div id="reactionBox" class="reaction-box">
                    <span id="reactionText">Aguardando...</span>
                </div>
                <button id="reactionStartBtn" class="start-btn" onclick="startReaction()">COMEÇAR</button>
                <div id="reactionResult" class="result hidden"></div>
            </div>
        </div>

        <!-- Color Match Game -->
        <div id="colorMatchGame" class="game-container hidden">
            <div class="game-header">
                <h2>🎨 Color Match</h2>
                <button class="back-btn" onclick="backToMenu()">← Voltar</button>
            </div>
            <div class="game-content">
                <div class="stats">
                    <div class="stat">
                        <span class="label">Tempo:</span>
                        <span class="value" id="colorTime">30</span>s
                    </div>
                    <div class="stat">
                        <span class="label">Pontos:</span>
                        <span class="value" id="colorScore">0</span>
                    </div>
                </div>
                <div class="color-display">
                    <span class="label">Procure por:</span>
                    <div id="colorTarget" class="color-target"></div>
                </div>
                <div id="colorGrid" class="color-grid"></div>
                <button id="colorStartBtn" class="start-btn" onclick="startColorMatch()">COMEÇAR</button>
                <div id="colorResult" class="result hidden"></div>
            </div>
        </div>

        <!-- Flappy Bird Game -->
        <div id="flappyBirdGame" class="game-container hidden">
            <div class="game-header">
                <h2>🐦 Flappy Bird</h2>
                <button class="back-btn" onclick="backToMenu()">← Voltar</button>
            </div>
            <div class="game-content">
                <div class="stats">
                    <div class="stat">
                        <span class="label">Pontos:</span>
                        <span class="value" id="birdScore">0</span>
                    </div>
                </div>
                <canvas id="flappyCanvas" width="300" height="400"></canvas>
                <button id="birdStartBtn" class="start-btn" onclick="startFlappyBird()">COMEÇAR</button>
                <div id="birdResult" class="result hidden"></div>
            </div>
        </div>
    </div>

    <script src="js/app.js"></script>
    <script src="js/games.js"></script>
</body>
</html>
